[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "second-opinion-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "openai>=1.40",
  "aiosqlite>=0.20",
  "trafilatura>=1.12",
  "selectolax>=0.3.21",
  "tldextract>=5.1",
  "phonenumbers>=8.13",
  "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "respx>=0.21", "pytest-asyncio>=0.24"]
browser = ["playwright>=1.45"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"**/contracts.py" = ["I001"]
"**/export_schema.py" = ["E402"]
"**/demo_check.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
